<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;padding:16px}

button{margin-top:.7rem;width:100%;font:inherit;font-weight:700;padding:.7rem;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
#e{color:var(--err);font-size:.88rem;min-height:1.2em;margin-top:.6rem}
